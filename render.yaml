# Render Blueprint: Render 대시보드 > New > Blueprint 에서 이 저장소를 고르면 아래 설정으로 웹 서비스를 만든다.
# sync: false 인 값(비밀 값)은 저장소에 적지 않고, 처음 만들 때 대시보드에서 직접 입력한다.
services:
  - type: web
    name: visit-assistant
    runtime: python
    plan: free  # 15분 동안 요청이 없으면 잠들고, 다음 요청 때 깨어나는 데 1분 정도 걸린다
    buildCommand: pip install -r requirements.txt
    # 워커 1개 고정: 중복 저장 방지(thread_id 잠금·저장소 잠금)가 프로세스 1개를 전제로 한다
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ACCESS_PASSWORD  # 화면과 /query 접속 비밀번호 (src/api.py 의 require_password)
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        sync: false
